[project]
name = "media-library"
version = "0.1.0"
description = "Локальна бібліотека медіа з семантичним пошуком"
requires-python = ">=3.12"

# Рантайм. Усе, що потрапляє у фінальну збірку.
# torch тут свідомо відсутній: моделі виконуються через onnxruntime та ctranslate2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pywebview>=5.3",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.9",
    "numpy>=2.1",
    "pillow>=11.0",
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "av>=13.0",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
# Лише для розробки: експорт моделей в ONNX і заміри на Фазі 0.
# У збірку не входить.
dev = [
    "torch",
    "transformers>=4.45",
    "optimum[exporters]>=1.23",
    "sentence-transformers>=3.2",
    "fonttools>=4.55",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: тест запускає ffmpeg або інші зовнішні інструменти",
]

[tool.ruff]
line-length = 100
target-version = "py312"
